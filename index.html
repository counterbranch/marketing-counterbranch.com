<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Applies the visitor's stored or system color scheme before first paint,
      // so the page never flashes light-then-dark (or vice versa) on load.
      // Mirrors the storage keys and attribute MUI's ThemeProvider manages at
      // runtime (see cssVariables.colorSchemeSelector in src/theme.ts).
      ;(function () {
        try {
          var mode = localStorage.getItem('mui-mode') || 'system'
          var light = localStorage.getItem('mui-color-scheme-light') || 'light'
          var dark = localStorage.getItem('mui-color-scheme-dark') || 'dark'
          var scheme =
            mode === 'dark'
              ? dark
              : mode === 'light'
                ? light
                : window.matchMedia('(prefers-color-scheme: dark)').matches
                  ? dark
                  : light
          document.documentElement.setAttribute('data-mui-color-scheme', scheme)
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Run the same permission tests before and after a change, using isolated instances of supported apps or your native policy engine. See what became allowed or denied." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#00E8FC" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A0A0C" />
    <link rel="canonical" href="https://counterbranch.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Counterbranch" />
    <meta property="og:title" content="Counterbranch" />
    <meta property="og:description" content="Run the same permission tests before and after a change, using isolated instances of supported apps or your native policy engine. See what became allowed or denied." />
    <meta property="og:url" content="https://counterbranch.com/" />
    <meta property="og:image" content="https://counterbranch.com/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://counterbranch.com/og-image.png" />
    <title>Counterbranch</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
