<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Applies the visitor's stored or system color scheme before first paint,
      // so the page never flashes light-then-dark (or vice versa) on load.
      // Mirrors the storage keys and attribute MUI's ThemeProvider manages at
      // runtime (see cssVariables.colorSchemeSelector in src/theme.ts).
      ;(function () {
        try {
          var mode = localStorage.getItem('mui-mode') || 'system'
          var light = localStorage.getItem('mui-color-scheme-light') || 'light'
          var dark = localStorage.getItem('mui-color-scheme-dark') || 'dark'
          var scheme =
            mode === 'dark'
              ? dark
              : mode === 'light'
                ? light
                : window.matchMedia('(prefers-color-scheme: dark)').matches
                  ? dark
                  : light
          document.documentElement.setAttribute('data-mui-color-scheme', scheme)
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Counterbranch component showcase" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6FAFB" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B1220" />
    <meta name="robots" content="noindex" />
    <title>Kitchen Sink — Counterbranch</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/kitchen-sink.tsx"></script>
  </body>
</html>
