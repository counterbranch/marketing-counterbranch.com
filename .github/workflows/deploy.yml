name: Deploy to GitHub Pages

on:
  # While the pre-launch teaser is live, this branch deploys the site and main
  # does not. That needs the github-pages environment's deployment branches to
  # allow this branch and not main (see README).
  push:
    branches: [feat/soft-launch-teaser]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Its own group, so main's runs, which the environment refuses anyway, never
# cancel a teaser deploy in progress.
concurrency:
  group: pages-teaser
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Before the build, so the build knows where the site is served from:
      # base_path is the repository's subpath on github.io, and empty once a
      # custom domain serves the site from its root.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
